
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator ❤️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <h1>❤️ Love Calculator ❤️</h1>
        <p>Check your fun compatibility!</p>

        <input type="text" id="yourName" placeholder="Enter Your Name">

        <input type="text" id="partnerName" placeholder="Enter Partner's Name">

        <button id="calculateBtn">Calculate Love ❤️</button>

        <div id="result">
            <h2 id="percentage"></h2>
            <p id="message"></p>
        </div>

        <button id="resetBtn">Reset 🔄</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
